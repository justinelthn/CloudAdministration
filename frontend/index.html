<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Finder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Movie Finder</h1>

  <div class="filters">
    <label>Réalisateur <input id="director" type="text" placeholder="Ex: Nolan"></label>
    <label>Acteur <input id="actor" type="text" placeholder="Ex: DiCaprio"></label>
    <label>Genre
      <select id="genre">
        <option value="">Tous</option>
        <option>Drama</option>
        <option>Action</option>
        <option>Comedy</option>
        <option>Horror</option>
        <option>Romance</option>
        <option>Sci-Fi</option>
        <option>Thriller</option>
        <option>Animation</option>
        <option>Documentary</option>
      </select>
    </label>
    <label>Langue
      <select id="language">
        <option value="">Toutes</option>
        <option>English</option>
        <option>French</option>
        <option>German</option>
        <option>Spanish</option>
        <option>Japanese</option>
        <option>Korean</option>
      </select>
    </label>
    <label>Note min <input id="min_rating" type="number" step="0.1" min="0" max="5" placeholder="3.5"></label>
    <button id="searchBtn">Rechercher</button>
  </div>

  <p id="info"></p>

  <table id="results">
    <thead>
      <tr>
        <th>Titre</th>
        <th>Réalisateur</th>
        <th>Acteurs</th>
        <th>Genres</th>
        <th>Langue</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>

</html>
