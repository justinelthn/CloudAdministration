version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: come
      POSTGRES_DB: movies_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./data/import.sql:/docker-entrypoint-initdb.d/1-import.sql
      - ./data/Movie_Data_File.csv:/data/Movie_Data_File.csv
    command: >
      postgres -c "listen_addresses=*"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U come -d movies_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - DATABASE_URL=host=db user=come dbname=movies_db sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    deploy:
      replicas: 3 # Parallélisme : on lance 3 API Go en même temps

  nginx-lb:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
